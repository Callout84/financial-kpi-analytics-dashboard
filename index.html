/* ============ TOKENS / FORMATTERS ============ */
const C = {bg:'#0E0E10',panel:'#16161A',panel2:'#1C1C21',border:'#28282F',text:'#ECEAE3',
  muted:'#8C8B85',faint:'#5A5A60',accent:'#E0A82E',pos:'#56B891',neg:'#D9544D',grey:'#C9A14A',blue:'#7FA8D9'};
const FONT_MONO="'IBM Plex Mono',monospace";

const fmtCr=(v)=>{if(v==null)return'—';const a=Math.abs(v);
  if(a>=1e5)return (v/1e5).toFixed(2)+' L Cr';
  if(a>=1e3)return (v/1e3).toFixed(1)+' K Cr';
  return Math.round(v).toLocaleString('en-IN')+' Cr';};
const fmtNum=(v)=>v==null?'—':v.toLocaleString('en-IN');

Chart.defaults.color=C.muted;
Chart.defaults.font.family=FONT_MONO;
Chart.defaults.font.size=10;
Chart.defaults.borderColor=C.border;

const tooltipCfg={backgroundColor:C.panel2,borderColor:C.border,borderWidth:1,
  titleColor:C.text,bodyColor:C.text,titleFont:{family:FONT_MONO,size:12,weight:'600'},
  bodyFont:{family:FONT_MONO,size:11},padding:10,cornerRadius:6,displayColors:false};

function gradient(ctx,area,color){
  if(!area)return color+'22';
  const g=ctx.createLinearGradient(0,area.top,0,area.bottom);
  g.addColorStop(0,color+'59');g.addColorStop(1,color+'00');return g;
}

function deltaTag(value,suffix){
  const up=value>=0,col=up?C.pos:C.neg,arr=up?'▲':'▼';
  return `<span class="delta" style="color:${col};background:${col}1A">${arr} ${up?'+':''}${value.toFixed(1)}${suffix}</span>`;
}

/* ============ ABA 1: PANORAMA ============ */
function buildPanorama(){
  const k=DATA.kpis;
  const accents=[C.accent,C.pos,C.neg,C.blue];
  const cards=[k.receita,k.margem,k.alavancagem,k.valuation];
  const cardHtml=cards.map((c,i)=>{
    const disp=c.unit==='%'?c.value.toFixed(1)+'%':fmtCr(c.value);
    const sfx=c.unit==='%'?'pp':'%';
    return `<div class="card" style="padding:18px 20px 12px;position:relative;overflow:hidden">
      <div style="position:absolute;top:0;left:0;width:3px;height:100%;background:${accents[i]}"></div>
      <div class="font-mono" style="color:var(--muted);font-size:11px;letter-spacing:.4px;text-transform:uppercase">${c.label}</div>
      <div style="display:flex;align-items:baseline;gap:10px;margin-top:8px">
        <span class="font-display" style="font-size:30px;font-weight:600;line-height:1">${disp}</span>
        ${deltaTag(c.delta,sfx)}
      </div>
      <div style="height:44px;margin:12px -6px 0"><canvas id="spark-${i}"></canvas></div>
      <div class="font-mono" style="color:var(--faint);font-size:10px;margin-top:2px">série reconstruída · ${c.series[0].t} → ${c.series[c.series.length-1].t}</div>
    </div>`;
  }).join('');

  document.getElementById('tab-panorama').innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px">${cardHtml}</div>
    <div class="card" style="margin-top:24px;padding:20px 20px 8px">
      <div style="margin-bottom:14px">
        <h2 class="sec-title">Valuation vs. Alavancagem do Universo</h2>
        <p class="sec-sub">Soma agregada do universo · pontos-snapshot reconstruídos (−10a → atual). Capital de mercado expandiu mais rápido que a dívida — desalavancagem relativa.</p>
      </div>
      <div style="height:240px"><canvas id="trendChart"></canvas></div>
    </div>
    <div style="display:flex;gap:12px;margin-top:16px;flex-wrap:wrap">
      ${statPill('P/E mediano',k.pe_mediano+'x')}
      ${statPill('ROE mediano',k.roe_mediano+'%')}
      ${statPill('Dívida/Patrimônio mediano',k.de_mediano+'x')}
      ${statPill('Empresas',fmtNum(k.n_empresas))}
      ${statPill('Setores',k.n_setores)}
    </div>`;
}
function statPill(label,value){
  return `<div class="card" style="padding:12px 16px;flex:1">
    <div class="font-mono" style="color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.4px">${label}</div>
    <div class="font-display" style="font-size:22px;font-weight:600;margin-top:2px">${value}</div></div>`;
}
function renderPanoramaCharts(){
  const k=DATA.kpis,accents=[C.accent,C.pos,C.neg,C.blue];
  [k.receita,k.margem,k.alavancagem,k.valuation].forEach((c,i)=>{
    new Chart(document.getElementById('spark-'+i),{
      type:'line',
      data:{labels:c.series.map(p=>p.t),
        datasets:[{data:c.series.map(p=>p.v),borderColor:accents[i],borderWidth:1.8,
          tension:.35,pointRadius:0,fill:true,
          backgroundColor:(ctx)=>gradient(ctx.chart.ctx,ctx.chart.chartArea,accents[i])}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{...tooltipCfg,
          callbacks:{label:(t)=>c.unit==='%'?t.parsed.y+'%':fmtCr(t.parsed.y)}}},
        scales:{x:{display:false},y:{display:false}}}});
  });
  // mescla séries mcap (valuation) + debt (alavancagem) por rótulo temporal
  const map={};
  k.valuation.series.forEach(p=>map[p.t]={t:p.t,mcap:p.v});
  k.alavancagem.series.forEach(p=>map[p.t]={...(map[p.t]||{t:p.t}),debt:p.v});
  const trend=Object.values(map);
  new Chart(document.getElementById('trendChart'),{
    type:'line',
    data:{labels:trend.map(p=>p.t),datasets:[
      {label:'Market Cap',data:trend.map(p=>p.mcap??null),borderColor:C.accent,borderWidth:2.2,
       tension:.3,pointRadius:3,pointBackgroundColor:C.accent,spanGaps:true},
      {label:'Dívida',data:trend.map(p=>p.debt??null),borderColor:C.neg,borderWidth:2.2,
       borderDash:[5,4],tension:.3,pointRadius:3,pointBackgroundColor:C.neg,spanGaps:true}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:C.muted,usePointStyle:true,boxWidth:8,font:{family:FONT_MONO,size:11}}},
        tooltip:{...tooltipCfg,callbacks:{label:(t)=>t.dataset.label+': '+fmtCr(t.parsed.y)}}},
      scales:{x:{grid:{display:false},ticks:{color:C.muted}},
        y:{grid:{color:C.border},ticks:{color:C.muted,callback:(v)=>(v/1e5).toFixed(0)+'L'}}}}});
}

/* ============ ABA 2: PERFORMANCE ============ */
function buildPerformance(){
  document.getElementById('tab-performance').innerHTML=`
    <div style="display:grid;gap:22px">
      <div class="card" style="padding:20px">
        <div style="margin-bottom:14px">
          <h2 class="sec-title">Maiores Expansões vs. Contrações</h2>
          <p class="sec-sub">Crescimento de receita 5 anos (CAGR). Filtrado para Market Cap ≥ 500 Cr — micro-caps removidas para eliminar ruído estatístico.</p>
        </div>
        <div style="height:380px"><canvas id="divChart"></canvas></div>
      </div>
      <div class="card" style="padding:20px">
        <div style="margin-bottom:14px">
          <h2 class="sec-title">Crescimento Mediano por Setor (Top 14 por Market Cap)</h2>
          <p class="sec-sub">Setores ordenados por capitalização. Barras = crescimento mediano de receita (5a) e lucro (5a) por setor.</p>
        </div>
        <div style="height:360px"><canvas id="indChart"></canvas></div>
      </div>
    </div>`;
}
function renderPerformanceCharts(){
  const r=DATA.rankings;
  const div=[...r.top_growth,...r.bottom_growth].sort((a,b)=>b.sales_g5-a.sales_g5);
  new Chart(document.getElementById('divChart'),{
    type:'bar',
    data:{labels:div.map(x=>x.name),
      datasets:[{data:div.map(x=>x.sales_g5),
        backgroundColor:div.map(x=>x.sales_g5>=0?C.pos:C.neg),borderRadius:3,
        _meta:div}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{...tooltipCfg,
        callbacks:{title:(t)=>{const p=div[t[0].dataIndex];return p.name+' · '+p.industry;},
          label:(t)=>'Sales CAGR 5a: '+t.parsed.x+'%'}}},
      scales:{x:{grid:{color:C.border},ticks:{color:C.muted,callback:(v)=>v+'%'}},
        y:{grid:{display:false},ticks:{color:C.text,font:{family:FONT_MONO,size:10.5}}}}}});

  const ind=DATA.industries.slice(0,14).map(x=>({
    name:x.Industry.length>22?x.Industry.slice(0,22)+'…':x.Industry,
    sales:x.sales_g5,profit:x.profit_g5}));
  new Chart(document.getElementById('indChart'),{
    type:'bar',
    data:{labels:ind.map(x=>x.name),datasets:[
      {label:'Receita 5a',data:ind.map(x=>x.sales),backgroundColor:C.accent,borderRadius:3,maxBarThickness:22},
      {label:'Lucro 5a',data:ind.map(x=>x.profit),backgroundColor:C.blue,borderRadius:3,maxBarThickness:22}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:C.muted,usePointStyle:true,boxWidth:8,font:{family:FONT_MONO,size:11}}},
        tooltip:{...tooltipCfg,callbacks:{label:(t)=>t.dataset.label+': '+t.parsed.y+'%'}}},
      scales:{x:{grid:{display:false},ticks:{color:C.muted,maxRotation:40,minRotation:40,font:{size:9.5}}},
        y:{grid:{color:C.border},ticks:{color:C.muted,callback:(v)=>v+'%'}}}}});
}

/* ============ ABA 3: RISCO ============ */
const ZONE={distress:C.neg,grey:C.grey,safe:C.pos};
function buildRisco(){
  const a=DATA.attention,total=a.distress+a.grey+a.safe;
  const cards=[
    {icon:ICON.alertBig,label:'Zona de Distress (Altman < 1,8)',value:a.distress,sub:((a.distress/total)*100).toFixed(1)+'% do universo',col:C.neg},
    {icon:ICON.gauge,label:'Alavancagem Alta (D/E > 3)',value:a.high_leverage,sub:'risco de solvência',col:C.neg},
    {icon:ICON.trendDown,label:'ROE Negativo (large-cap)',value:a.neg_roe_largecap,sub:'Mcap ≥ 1.000 Cr destruindo valor',col:C.grey},
    {icon:ICON.activity,label:'P/E Extremo (> 100x)',value:a.extreme_pe,sub:'risco de reprecificação',col:C.grey},
    {icon:ICON.shield,label:'Zona Segura (Altman > 3)',value:a.safe,sub:((a.safe/total)*100).toFixed(1)+'% do universo',col:C.pos}];
  const cardHtml=cards.map(c=>`<div class="card" style="padding:16px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <span style="color:${c.col}">${c.icon}</span>
      <span class="font-display" style="font-size:26px;font-weight:600">${c.value}</span></div>
    <div style="font-size:12.5px;margin-top:8px;font-weight:500">${c.label}</div>
    <div class="font-mono" style="color:var(--muted);font-size:10.5px;margin-top:2px">${c.sub}</div></div>`).join('');
  document.getElementById('tab-risco').innerHTML=`
    <div style="display:grid;gap:22px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px">${cardHtml}</div>
      <div class="card" style="padding:20px">
        <div style="margin-bottom:14px">
          <h2 class="sec-title">Matriz de Risco — Alavancagem × Retorno</h2>
          <p class="sec-sub">Eixo X: Dívida/Patrimônio (winsorizado 1–99%). Eixo Y: ROE. Cor: zona de solvência (Altman Z). Tamanho: Market Cap. Amostra das 220 maiores caps + distress relevante.</p>
        </div>
        <div style="height:420px"><canvas id="scatterChart"></canvas></div>
        <div style="display:flex;gap:18px;margin-top:10px">
          ${legendDot('Distress (Z<1,8)',C.neg)}${legendDot('Cinzenta (1,8–3)',C.grey)}${legendDot('Segura (Z>3)',C.pos)}
        </div>
      </div>
    </div>`;
}
function legendDot(l,c){
  return `<span style="display:inline-flex;align-items:center;gap:6px;font-family:${FONT_MONO};font-size:11px;color:var(--muted)">
    <span style="width:10px;height:10px;border-radius:50%;background:${c}"></span>${l}</span>`;
}
const quadrantPlugin={
  id:'quadrant',
  afterDraw(chart){
    const {ctx,chartArea,scales}=chart;const opt=chart.config.options.plugins.quadrant;
    if(!opt)return;ctx.save();ctx.setLineDash([4,4]);ctx.strokeStyle=C.faint;ctx.lineWidth=1;
    const yz=scales.y.getPixelForValue(0);
    ctx.beginPath();ctx.moveTo(chartArea.left,yz);ctx.lineTo(chartArea.right,yz);ctx.stroke();
    const xm=scales.x.getPixelForValue(opt.xMedian);
    ctx.beginPath();ctx.moveTo(xm,chartArea.top);ctx.lineTo(xm,chartArea.bottom);ctx.stroke();
    ctx.setLineDash([]);ctx.fillStyle=C.faint;ctx.font='9px '+FONT_MONO;
    ctx.fillText('D/E mediano',xm+4,chartArea.top+10);ctx.restore();
  }
};
function renderRiscoCharts(){
  const pts=DATA.scatter;
  const maxMcap=Math.max(...pts.map(p=>p.mcap));
  const scaleR=(m)=>4+22*(Math.sqrt(m)/Math.sqrt(maxMcap));
  const byZone={distress:[],grey:[],safe:[]};
  pts.forEach(p=>byZone[p.zone].push({x:p.de,y:p.roe,r:scaleR(p.mcap),raw:p}));
  const ds=Object.keys(byZone).map(z=>({label:z,data:byZone[z],
    backgroundColor:ZONE[z]+'C7',borderColor:ZONE[z],borderWidth:1}));
  new Chart(document.getElementById('scatterChart'),{
    type:'bubble',data:{datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},quadrant:{xMedian:DATA.kpis.de_mediano},
        tooltip:{...tooltipCfg,callbacks:{
          title:(t)=>t[0].raw.raw.name,
          label:(t)=>{const p=t.raw.raw;return [p.industry,
            'D/E '+p.de+'x · ROE '+p.roe+'%','Altman Z '+p.altman+' · P/E '+(p.pe??'—')+'x','Mcap '+fmtCr(p.mcap)];}}}},
      scales:{
        x:{grid:{color:C.border},ticks:{color:C.muted,callback:(v)=>v+'x'},
          title:{display:true,text:'Dívida / Patrimônio →',color:C.muted,font:{family:FONT_MONO,size:11}}},
        y:{grid:{color:C.border},ticks:{color:C.muted,callback:(v)=>v+'%'},
          title:{display:true,text:'ROE %',color:C.muted,font:{family:FONT_MONO,size:11}}}}},
    plugins:[quadrantPlugin]});
}

/* ============ NAV / LAZY RENDER ============ */
const rendered={panorama:false,performance:false,risco:false};
const renderFns={panorama:renderPanoramaCharts,performance:renderPerformanceCharts,risco:renderRiscoCharts};
function activate(tab){
  document.querySelectorAll('.tab-pane').forEach(s=>s.classList.add('hidden'));
  document.getElementById('tab-'+tab).classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  if(!rendered[tab]){renderFns[tab]();rendered[tab]=true;}
}

/* ============ BOOT ============ */
renderShell();
buildPanorama();buildPerformance();buildRisco();
document.getElementById('nav').addEventListener('click',(e)=>{
  const btn=e.target.closest('.tab-btn');if(btn)activate(btn.dataset.tab);});
renderPanoramaCharts();rendered.panorama=true;  // aba inicial visível
</script>
</body>
</html>
